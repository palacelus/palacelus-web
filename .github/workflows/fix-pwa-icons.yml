name: Fix PWA icons

on:
  push:
    paths:
      - '.github/workflows/fix-pwa-icons.yml'

permissions:
  contents: write

jobs:
  fix-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write valid PNG icons and update PWA files
        shell: bash
        run: |
          echo '' | base64 -d > app-icon-192.png
          echo '' | base64 -d > app-icon-512.png
          cat > manifest.webmanifest <<'EOF'
          {
            "id": "/",
            "name": "PalaCelus",
            "short_name": "PalaCelus",
            "description": "Servicio técnico, repuestos y cotización de reparaciones en Banfield.",
            "start_url": "/",
            "scope": "/",
            "display": "standalone",
            "background_color": "#0b0d10",
            "theme_color": "#0b0d10",
            "orientation": "portrait-primary",
            "prefer_related_applications": false,
            "icons": [
              {"src":"/app-icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"/app-icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"}
            ]
          }
          EOF
          cat > service-worker.js <<'EOF'
          const CACHE='palacelus-v4';
          const CORE=['/','/styles.css','/script.js?v=8','/manifest.webmanifest','/app-icon-192.png','/app-icon-512.png'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(CORE)).then(()=>self.skipWaiting()));});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;event.respondWith(fetch(event.request).then(response=>{const copy=response.clone();caches.open(CACHE).then(cache=>cache.put(event.request,copy));return response;}).catch(()=>caches.match(event.request).then(r=>r||caches.match('/'))));});
          EOF
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-icon-192.png app-icon-512.png manifest.webmanifest service-worker.js
          git commit -m 'Fix PWA icons with valid binary PNG files'
          git push
