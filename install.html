<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>Instalar PalaCelus</title>
  <link rel="manifest" href="/manifest-v2.webmanifest">
  <link rel="icon" href="/pwa-ok-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/pwa-ok-192.png">
  <style>
    body{margin:0;background:#0b0d10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
    .card{width:min(420px,100%);background:#12161c;border:1px solid #25303a;border-radius:24px;padding:28px;box-sizing:border-box;text-align:center}
    img{width:96px;height:96px;border-radius:22px;margin-bottom:16px}
    h1{margin:0 0 8px;font-size:28px}
    p{color:#aeb8c2;line-height:1.45}
    button{width:100%;border:0;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:800;background:#2dd4a7;color:#06130f;cursor:pointer;margin-top:14px}
    #status{margin-top:18px;font-size:13px;color:#92a0ad;white-space:pre-line}
    .ok{color:#86efac}
  </style>
</head>
<body>
  <main class="card" id="card">
    <img src="/pwa-ok-192.png" alt="PalaCelus">
    <h1>PalaCelus</h1>
    <p>Instalá PalaCelus como una app en tu celular.</p>
    <button id="installBtn">Tocá acá para habilitar instalación</button>
    <div id="status">Comprobando PWA…</div>
  </main>
  <script>
    let deferredPrompt = null;
    let interacted = false;
    let startedAt = Date.now();
    let timer = null;
    const btn = document.getElementById('installBtn');
    const status = document.getElementById('status');

    async function checks(){
      const lines=[];
      try{
        const r=await fetch('/manifest-v2.webmanifest',{cache:'no-store'});
        lines.push('Manifest: '+(r.ok?'OK':'ERROR '+r.status));
      }catch(e){lines.push('Manifest: ERROR');}
      if('serviceWorker' in navigator){
        try{
          await navigator.serviceWorker.register('/service-worker-v2.js',{scope:'/'});
          await navigator.serviceWorker.ready;
          lines.push('Service worker: OK');
        }catch(e){lines.push('Service worker: ERROR');}
      }else lines.push('Service worker: no compatible');
      lines.push('Chrome necesita 1 toque + ~30 s de uso antes de habilitar el instalador.');
      status.textContent=lines.join('\n');
    }

    function beginEngagement(){
      if(interacted) return;
      interacted = true;
      startedAt = Date.now();
      btn.textContent='Esperando a Chrome…';
      const update=()=>{
        if(deferredPrompt){ clearInterval(timer); return; }
        const elapsed=Math.floor((Date.now()-startedAt)/1000);
        const remain=Math.max(0,30-elapsed);
        btn.textContent = remain>0 ? `Esperando a Chrome… ${remain}s` : 'Chrome está validando…';
        if(remain===0){ status.textContent = status.textContent.replace(/\nEsperá.*$/,'') + '\nYa cumplimos el tiempo mínimo. Si Chrome habilita el evento, el botón cambia solo.'; }
      };
      update();
      timer=setInterval(update,1000);
    }

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      if(timer) clearInterval(timer);
      btn.textContent = 'Instalar PalaCelus';
      status.textContent += '\nChrome: LISTA PARA INSTALAR ✓';
    });

    window.addEventListener('appinstalled',()=>{
      btn.textContent='PalaCelus instalada ✓';
      status.textContent+='\nInstalación completada.';
    });

    btn.addEventListener('click', async()=>{
      if(deferredPrompt){
        deferredPrompt.prompt();
        const choice=await deferredPrompt.userChoice;
        status.textContent+='\nResultado: '+choice.outcome;
        deferredPrompt=null;
        return;
      }
      beginEngagement();
    });

    document.getElementById('card').addEventListener('pointerdown',()=>{
      if(!interacted) beginEngagement();
    },{once:true});

    checks();
  </script>
</body>
</html>
