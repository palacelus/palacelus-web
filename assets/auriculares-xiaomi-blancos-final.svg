<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#d9dde1"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f5f6f7"/>
      <stop offset="1" stop-color="#d7dade"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#68717a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="900" rx="36" fill="url(#bg)"/>
  <ellipse cx="450" cy="765" rx="300" ry="55" fill="#9ba3aa" opacity="0.24"/>

  <!-- Cable loop -->
  <path d="M305 550 C165 635 205 790 405 790 C640 790 720 680 625 605 C565 558 490 565 455 620"
        fill="none" stroke="#f8f9fa" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M305 550 C165 635 205 790 405 790 C640 790 720 680 625 605 C565 558 490 565 455 620"
        fill="none" stroke="#cfd4d8" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

  <!-- Left earbud -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="295" r="92" fill="url(#white)" stroke="#c8cdd2" stroke-width="4"/>
    <ellipse cx="268" cy="265" rx="47" ry="34" fill="#111820"/>
    <rect x="280" y="355" width="40" height="220" rx="20" fill="url(#white)" stroke="#c8cdd2" stroke-width="3"/>
    <circle cx="300" cy="295" r="70" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.75"/>
  </g>

  <!-- Right earbud -->
  <g filter="url(#shadow)">
    <circle cx="600" cy="305" r="92" fill="url(#white)" stroke="#c8cdd2" stroke-width="4"/>
    <ellipse cx="634" cy="274" rx="47" ry="34" fill="#111820"/>
    <rect x="580" y="365" width="40" height="205" rx="20" fill="url(#white)" stroke="#c8cdd2" stroke-width="3"/>
    <circle cx="600" cy="305" r="70" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.75"/>
  </g>

  <!-- Inline remote -->
  <g filter="url(#shadow)">
    <rect x="435" y="530" width="72" height="155" rx="30" fill="url(#white)" stroke="#c7ccd1" stroke-width="3"/>
    <circle cx="471" cy="568" r="10" fill="#b7bdc3"/>
    <rect x="463" y="595" width="16" height="44" rx="8" fill="#c2c7cc"/>
  </g>

  <!-- USB-C cable -->
  <path d="M471 685 C471 710 470 724 470 742" fill="none" stroke="#f8f9fa" stroke-width="22" stroke-linecap="round"/>

  <!-- USB-C connector -->
  <g filter="url(#shadow)">
    <rect x="420" y="735" width="102" height="92" rx="24" fill="url(#white)" stroke="#c5cad0" stroke-width="3"/>
    <rect x="439" y="704" width="64" height="45" rx="14" fill="#aeb6bd"/>
    <rect x="447" y="711" width="48" height="31" rx="10" fill="#2b3238"/>
  </g>

  <text x="450" y="95" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#1b232a">Auriculares Xiaomi USB-C</text>
  <text x="450" y="140" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#5d6871">Blancos · con micrófono y control</text>
</svg>