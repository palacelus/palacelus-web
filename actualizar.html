<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Actualizar PalaCelus</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d10;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.box{width:min(520px,calc(100% - 28px));background:#12171c;border:1px solid #29333d;border-radius:24px;padding:28px;text-align:center}.mark{width:62px;height:62px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:#2dd4a7;color:#07130f;font-weight:950;font-size:18px}h1{margin:0 0 10px;font-size:32px}p{margin:0;color:#9da8b2;line-height:1.5}.bar{height:8px;background:#202932;border-radius:999px;overflow:hidden;margin:22px 0}.bar span{display:block;height:100%;width:0;background:#2dd4a7;animation:go 1.8s ease forwards}@keyframes go{to{width:100%}}.ok{font-size:13px;color:#75deb5;font-weight:800}
</style>
</head>
<body><div class="box"><div class="mark">PC</div><h1>Actualizando PalaCelus…</h1><p>Limpiando la versión anterior para cargar la tienda nueva.</p><div class="bar"><span></span></div><div id="status" class="ok">Preparando actualización…</div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister()));
   }
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.map(k=>caches.delete(k)));
   }
   status.textContent='Listo. Abriendo la versión nueva…';
 }catch(e){status.textContent='Actualizando…';}
 setTimeout(()=>location.replace('/?fresh=20261019-store'),900);
})();
</script></body></html>
